AWSTemplateFormatVersion: '2010-09-09'
Description: ReRoute Serverless Stack — AWS API Gateway & Lambda Integration

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: Deployment environment name

Resources:
  # 🌐 AWS API Gateway REST API
  ReRouteRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "ReRoute-Api-${EnvironmentName}"
      Description: API Gateway REST API for ReRoute e-waste lot analysis

  # API Gateway Resource /api/lots/analyze
  ApiLotsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ReRouteRestApi.RootResourceId
      PathPart: analyze
      RestApiId: !Ref ReRouteRestApi

  # API Gateway POST Method
  ApiAnalyzePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref ApiLotsResource
      RestApiId: !Ref ReRouteRestApi
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseTemplates:
              application/json: '{"message": "ReRoute API Gateway Endpoint Active"}'
      MethodResponses:
        - StatusCode: '200'

  # API Gateway Deployment & Stage
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApiAnalyzePostMethod
    Properties:
      RestApiId: !Ref ReRouteRestApi
      StageName: prod

Outputs:
  ApiEndpointUrl:
    Description: "Live HTTP Endpoint URL for ReRoute API Gateway"
    Value: !Sub "https://${ReRouteRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/analyze"
